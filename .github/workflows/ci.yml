name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun audit --audit-level=moderate

      - name: Lint Solidity
        run: bun run lint:bun:sol

      - name: Lint JS
        run: bun run lint:bun:js

      - name: Format check
        run: bunx prettier --check "**/*.{js,ts,json,md,sol}" --ignore-path .gitignore

      - name: Compile
        run: bun run compile:bun

      - name: Contract tests
        run: bun run test:contracts:bun

      - name: Setup Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          source $HOME/.foundry/env
          foundryup

      - name: Forge build
        run: |
          source $HOME/.foundry/env
          forge build

      - name: Build ABI artifact
        run: cp artifacts/contracts/ReplayTrackingContractV2.sol/ReplayTrackingContractV3.json server/abi.json
