name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Lint Solidity
        run: npm run lint:sol

      - name: Lint JS
        run: npm run lint:js

      - name: Format check
        run: npm run format:check

      - name: Compile
        run: npm run compile

      - name: Contract tests
        run: npm run test:contracts

      - name: Setup Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          source $HOME/.foundry/env
          foundryup

      - name: Forge build
        run: |
          source $HOME/.foundry/env
          forge build

      - name: Build ABI artifact
        run: cp artifacts/contracts/ReplayTrackingContractV2.sol/ReplayTrackingContractV3.json server/abi.json
